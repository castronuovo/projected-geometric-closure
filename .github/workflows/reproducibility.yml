name: Reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify committed release files
        run: sha256sum -c SHA256SUMS
      - name: Test input integrity and output coverage
        run: python -m unittest -v test_verified_download test_reproducibility_verifier
      - name: Cache verified DESI inputs
        uses: actions/cache@v5
        with:
          path: .cache/desi_dr1
          key: desi-dr1-v1-${{ hashFiles('desi_dr1_tangent_test.py', 'verified_download.py') }}
      - name: Preserve frozen scientific outputs
        run: |
          mkdir -p "$RUNNER_TEMP/frozen-outputs"
          cp \
            benchmark_identifiability.csv \
            cone_grid_convergence.csv \
            finite_residue_5d_spectrum.csv \
            survey_projected_benchmark.csv \
            conditional_information_requirement.csv \
            injection_recovery_summary.csv \
            cross_epoch_transport_benchmark.csv \
            causal_growth_transport_benchmark.csv \
            desi_dr1_tangent_scan.csv \
            finite_residue_5d_benchmark.json \
            survey_projected_benchmark.json \
            injection_recovery_summary.json \
            causal_growth_transport_summary.json \
            causal_transport_support_results.json \
            causal_transport_free_amplitude_results.json \
            spectral_shadow_duality.json \
            desi_dr1_tangent_summary.json \
            causal_second_order_allowance_results.json \
            causal_second_order_certified_range.csv \
            "$RUNNER_TEMP/frozen-outputs/"
      - name: Recompute benchmarks and restricted DESI diagnostic
        run: |
          python benchmark_projected_spectral.py
          python spectral_shadow_duality.py
          python finite_residue_5d_benchmark.py
          python injection_recovery.py
          python conditional_information_requirement.py
          python causal_growth_transport.py
          python causal_transport_support_audit.py
          python causal_transport_free_amplitude.py
          python causal_second_order_allowance.py
          python desi_dr1_tangent_test.py
          python rival_map_calibration_check.py
      - name: Validate citation metadata against the CFF schema
        run: |
          python -m pip install cffconvert==2.0.0
          cffconvert --validate
      - name: Verify numerically reproducible scientific outputs
        run: python verify_reproducibility.py "$RUNNER_TEMP/frozen-outputs"
