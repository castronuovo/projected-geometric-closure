name: Reproducibility

on:
  push:
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify committed release files
        run: sha256sum -c SHA256SUMS
      - name: Preserve frozen scientific outputs
        run: |
          mkdir -p "$RUNNER_TEMP/frozen-outputs"
          cp \
            benchmark_identifiability.csv \
            survey_projected_benchmark.csv \
            survey_projected_benchmark.json \
            "$RUNNER_TEMP/frozen-outputs/"
      - name: Recompute analytic and projected benchmarks
        run: python benchmark_projected_spectral.py
      - name: Verify numerically reproducible scientific outputs
        run: python verify_reproducibility.py "$RUNNER_TEMP/frozen-outputs"
